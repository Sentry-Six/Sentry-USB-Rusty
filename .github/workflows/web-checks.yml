name: web-checks

# Run the release workflow's web checks for direct frontend pushes. PRs already
# receive the same checks from build.yml.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-checks.yml'
      - 'Cargo.lock'
      - 'LICENSE'
      - 'NOTICE'
      - 'tools/third-party-notices.py'
  workflow_dispatch:

jobs:
  lint-web:
    name: Lint web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: |
          cd web
          npm ci
      - name: Install Rust
        # Pinned like the test job; the notices check reads Cargo.lock and the crates' sources.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
      # The licences served with the web UI must match its dependencies: after
      # a dependency change, run python3 -I tools/third-party-notices.py.
      - name: Check THIRD-PARTY-NOTICES.txt
        run: |
          cargo fetch --locked
          python3 -I tools/third-party-notices.py --check
      - name: Test web
        run: |
          cd web
          npm test
      - name: Lint web
        # Match the release workflow’s zero-warning check.
        run: |
          cd web
          npx eslint . --max-warnings 0
      - name: Production build
        # Direct pushes otherwise receive no production bundle check.
        run: |
          cd web
          npm run build -- --configLoader native
          if [ ! -s "dist/index.html" ]; then
            echo "::error::web/dist/index.html missing or empty after npm run build"
            exit 1
          fi
      - name: Icons up to date
        # Verify generated icons against symbols.mjs and the locked local package.
        run: |
          cd web
          npm run icons -- --check
