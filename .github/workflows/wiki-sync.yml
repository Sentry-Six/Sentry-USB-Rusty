name: Sync wiki

# Sync wiki/ to the initialized GitHub Wiki on relevant main pushes or manually.

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Push wiki/ to GitHub wiki
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5
        with:
          path: wiki/
          token: ${{ secrets.GITHUB_TOKEN }}
