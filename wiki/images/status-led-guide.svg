<svg xmlns="http://www.w3.org/2000/svg" width="640" height="792" viewBox="0 0 640 792" role="img" aria-labelledby="title description">
  <title id="title">Sentry USB status light: a quick guide</title>
  <desc id="description">Two short flashes every three seconds means connected. Fast pulses with brief dark gaps mean recent storage writes, not proof of saved video. One flash means waiting for USB. Slow even blinking means starting; fast even blinking means preparing. A mostly lit light with one brief dark dip every three seconds needs attention. Colours are for Pi 5 only; other supported Pis use the same rhythms on their green activity light. Animations stop when reduced motion is requested.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8f4fa; }
    .secondary { fill: #c3bacb; font-size: 19px; }
    .state { font-size: 25px; font-weight: 650; }
    .colour { fill: #c3bacb; font-size: 15px; }
    .led { animation-timing-function: steps(1, end); animation-iteration-count: infinite; }
    .starting { animation-name: half; animation-duration: 2s; }
    .preparing { animation-name: half; animation-duration: .5s; }
    .waiting { animation-name: single; animation-duration: 3s; }
    .connected { animation-name: double; animation-duration: 3s; }
    .writing { animation-name: write; animation-duration: .5s; }
    .attention { animation-name: attention; animation-duration: 3s; }
    @keyframes half { 0% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes single { 0% { opacity: 1; } 3.333333%, 100% { opacity: 0; } }
    @keyframes double { 0%, 8.333333% { opacity: 1; } 3.333333%, 11.666667%, 100% { opacity: 0; } }
    @keyframes write { 0% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes attention { 0% { opacity: 1; } 93.333333%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .led { animation: none; opacity: 1; } }
  </style>
  <rect width="640" height="792" rx="16" fill="#211c26"/>
  <text x="24" y="43" font-size="30" font-weight="700">Sentry USB status light</text>
  <text x="24" y="75" font-size="18" fill="#c3bacb">Colours on Pi 5 only. Same rhythms on other Pis.</text>
  <path d="M24 96H616" stroke="#453b4e"/>
  <text x="24" y="130" font-size="18" font-weight="600">Look for the rhythm</text>
  <text x="454" y="125" font-size="18" font-weight="600" text-anchor="middle">Pi 5</text>
  <text x="565" y="125" font-size="18" font-weight="600" text-anchor="middle">Other Pis</text>
  <text x="565" y="145" font-size="13" text-anchor="middle" fill="#c3bacb">Pi 4 / Zero / 3A+</text>
  <g id="connected">
    <rect x="12" y="156" width="616" height="83" rx="10" fill="#303b32"/>
    <text x="24" y="185" class="state">Connected</text>
    <text x="24" y="212" class="secondary">2 short flashes, then a pause</text>
    <circle cx="454" cy="190" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="454" cy="190" r="18" fill="#83cf79" class="led connected"/>
    <text x="454" y="224" class="colour" text-anchor="middle">Green</text>
    <circle cx="565" cy="190" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="565" cy="190" r="18" fill="#83cf79" class="led connected"/>
  </g>
  <path d="M24 239H616" stroke="#352c3d"/>
  <g id="writing">
    <text x="24" y="277" class="state">Storage writes</text>
    <text x="24" y="304" class="secondary">Fast pulses, mostly lit</text>
    <circle cx="454" cy="282" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="454" cy="282" r="18" fill="#83cf79" class="led writing"/>
    <text x="454" y="316" class="colour" text-anchor="middle">Green</text>
    <circle cx="565" cy="282" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="565" cy="282" r="18" fill="#83cf79" class="led writing"/>
  </g>
  <path d="M24 331H616" stroke="#352c3d"/>
  <g id="waiting">
    <text x="24" y="369" class="state">Waiting for USB</text>
    <text x="24" y="396" class="secondary">1 short flash, then a pause</text>
    <circle cx="454" cy="374" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="454" cy="374" r="18" fill="#83cf79" class="led waiting"/>
    <text x="454" y="408" class="colour" text-anchor="middle">Green</text>
    <circle cx="565" cy="374" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="565" cy="374" r="18" fill="#83cf79" class="led waiting"/>
  </g>
  <path d="M24 423H616" stroke="#352c3d"/>
  <g id="starting">
    <text x="24" y="461" class="state">Starting</text>
    <text x="24" y="488" class="secondary">Slow, even blinking</text>
    <circle cx="454" cy="466" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="454" cy="466" r="18" fill="#efb85f" class="led starting"/>
    <text x="454" y="500" class="colour" text-anchor="middle">Amber</text>
    <circle cx="565" cy="466" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="565" cy="466" r="18" fill="#83cf79" class="led starting"/>
  </g>
  <path d="M24 515H616" stroke="#352c3d"/>
  <g id="preparing">
    <text x="24" y="553" class="state">Preparing</text>
    <text x="24" y="580" class="secondary">Fast, even blinking</text>
    <circle cx="454" cy="558" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="454" cy="558" r="18" fill="#efb85f" class="led preparing"/>
    <text x="454" y="592" class="colour" text-anchor="middle">Amber</text>
    <circle cx="565" cy="558" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="565" cy="558" r="18" fill="#83cf79" class="led preparing"/>
  </g>
  <path d="M24 607H616" stroke="#352c3d"/>
  <g id="attention">
    <text x="24" y="645" class="state">Needs attention</text>
    <text x="24" y="672" class="secondary">Brief dark dip every 3 s</text>
    <circle cx="454" cy="650" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="454" cy="650" r="18" fill="#ff8088" class="led attention"/>
    <text x="454" y="684" class="colour" text-anchor="middle">Red</text>
    <circle cx="565" cy="650" r="18" fill="#463c4f" stroke="#5b4e66"/>
    <circle cx="565" cy="650" r="18" fill="#83cf79" class="led attention"/>
  </g>
  <path d="M24 705H616" stroke="#453b4e"/>
  <text x="24" y="734" font-size="18">Writing: mostly lit. Preparing: equal on/off.</text>
  <text x="24" y="758" font-size="16" fill="#c3bacb">Writes do not confirm that valid video was saved.</text>
  <text x="24" y="781" font-size="14" fill="#c3bacb">Examples apply after Sentry USB takes over the LED.</text>
</svg>
